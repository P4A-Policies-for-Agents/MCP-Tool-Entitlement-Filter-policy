---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: MCP Tool Response Field Entitlement Filter
    category: Security
    description: >-
      Maps each MCP tool to a CDGC schema and masks, nulls, or drops the
      tool-response fields that CDGC marks sensitive unless the caller's clearance
      and declared purpose entitle them.
    metadata/capabilities/injectionPoint: inbound
    metadata/capabilities/assetTypes: mcp
    metadata/interfaceScope: api
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    cdgcLoginUrl:
      type: string
      format: service
      description: IDMC login base URL, e.g. https://dm-us.informaticacloud.com.
    cdgcSearchUrl:
      type: string
      format: service
      description: >-
        CDGC search API base (the cdgc-api host serving ccgf-searchv2), e.g.
        https://cdgc-api.dm-us.informaticacloud.com.
    cdgcOrgUsername:
      type: string
      description: IDMC read-only service-account username.
      "@context": { "@characteristics": [security:sensitive] }
    cdgcOrgPassword:
      type: string
      description: IDMC service-account password.
      "@context": { "@characteristics": [security:sensitive] }
    toolSchemas:
      type: array
      description: >-
        Maps each MCP tool to the CDGC schema governing its results. On a tools/call
        whose params.name matches an entry's tool (exact, case-sensitive), that
        entry's schema defines per-field sensitivity and its recordsPath (or the
        global recordsPath) locates the records. Responses of unmapped tools and of
        other MCP methods pass through unfiltered, so map every tool that returns
        governed data.
      items:
        type: object
        properties:
          tool:
            type: string
            description: MCP tool name, exactly as sent in tools/call params.name.
          schemaId:
            type: string
            description: >-
              CDGC asset id of the scanned schema (flat file, table, etc.) whose
              governed columns and linked Business Terms define this tool's
              per-field sensitivity.
          recordsPath:
            type: string
            description: >-
              Optional "/"-separated path to this tool's record(s). Unset = the
              global recordsPath.
        required:
          - tool
          - schemaId
    recordsPath:
      type: string
      default: ""
      description: >-
        Default "/"-separated path into the tool-result payload to the record(s)
        whose fields are projected, e.g. "products", for toolSchemas entries without
        their own recordsPath. Empty = payload root; array = each element.
    sensitiveLevels:
      type: array
      items:
        type: string
        enum: [public, internal, confidential, restricted]
      default: [confidential, restricted]
      description: >-
        IDMC Business Term "Security Level" (securityClassification) values that
        mark a field sensitive — e.g. confidential, restricted. Matched
        case-insensitively against each column's linked term's structured
        classification. This is the primary sensitivity signal.
    sensitiveMarker:
      type: string
      default: confidential
      description: >-
        Fallback only, used when a term has no Security Level set: case-insensitive
        substring in the term's description that marks the field sensitive (e.g. a
        term whose definition says "Confidential: ...").
    clearanceHeader:
      type: string
      default: x-dp-clearance
      description: >-
        Request header carrying the caller's clearance level (e.g. from an upstream
        identity policy or JWT-to-header mapping), matched against clearedLevels.
    clearanceClaim:
      type: string
      description: >-
        Optional JWT claim name carrying the caller's clearance level. When set and
        present in the caller's (upstream-validated) Bearer token, it is used instead
        of clearanceHeader. Unset (default) = header mode. Requires a JWT Validation
        policy upstream to verify the token.
    purposeHeader:
      type: string
      default: x-dp-purpose
      description: >-
        Request header carrying the caller's declared processing purpose (e.g.
        fraud-detection, analytics), matched against allowedPurposes.
    purposeClaim:
      type: string
      description: >-
        Optional JWT claim name carrying the caller's declared purpose. When set and
        present in the caller's (upstream-validated) Bearer token, it is used instead
        of purposeHeader. Unset (default) = header mode. Requires a JWT Validation
        policy upstream to verify the token.
    clearedLevels:
      type: array
      items:
        type: string
        enum: [public, internal, confidential, restricted]
      default: [restricted]
      description: >-
        Clearance values entitled to see sensitive fields. A caller whose
        clearance is not in this set is not cleared (fail-closed).
    allowedPurposes:
      type: string
      default: ""
      description: >-
        Comma-separated declared purposes entitled to see sensitive fields. Empty =
        purpose is not checked (clearance alone governs). Non-empty = the caller's
        purpose must also be in this set.
    maskMode:
      type: string
      enum: [mask, nullify, drop]
      default: mask
      description: >-
        How a withheld sensitive field is rendered — mask (replace value with
        maskToken), nullify (set to null), or drop (remove the field entirely).
    maskToken:
      type: string
      default: "***"
      description: Replacement value used when maskMode is "mask".
    refreshIntervalSeconds:
      type: integer
      default: 86400
      minimum: 30
      description: Cache TTL for the derived field-sensitivity map before a lazy CDGC refresh.
    failOpenOnCdgcError:
      type: boolean
      default: true
      description: >-
        On a transient CDGC error with a cached map, keep enforcing it. With no map
        at all, pass the response through (never block on the policy's own outage).
        The caller-entitlement decision itself is always fail-closed.
    distributed:
      type: boolean
      default: false
      description: Share cached map + refresh lock across replicas (needs shared storage).
    timeout:
      type: integer
      default: 5000
      description: Per-call CDGC timeout (ms), clamped to a chained refresh budget (~15s).
  required:
    - cdgcLoginUrl
    - cdgcSearchUrl
    - cdgcOrgUsername
    - cdgcOrgPassword
    - toolSchemas
